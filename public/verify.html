<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Dokumen - Digital Signature</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .content {
            padding: 50px;
        }

        .verification-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border-left: 5px solid #28a745;
        }

        .verification-card.invalid {
            border-left-color: #dc3545;
        }

        .status-badge {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-valid {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .status-invalid {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .info-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }

        .info-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .info-label {
            font-weight: 600;
            color: #666;
            font-size: 13px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }

        .signers-section {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            padding: 25px;
            border-radius: 12px;
            margin: 25px 0;
            border: 2px solid #2196f3;
        }

        .signers-section h3 {
            color: #1976d2;
            margin-bottom: 20px;
        }

        .signer-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .signer-card:last-child {
            margin-bottom: 0;
        }

        .signer-card.valid {
            border-left-color: #28a745;
        }

        .signer-card.invalid {
            border-left-color: #dc3545;
        }

        .signer-status {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .signer-status.valid {
            background: #d4edda;
            color: #155724;
        }

        .signer-status.invalid {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #28a745;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .error h3 {
            margin-bottom: 15px;
        }

        .download-btn, .back-btn {
            display: inline-block;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            margin: 10px 5px;
            transition: all 0.3s ease;
        }

        .download-btn {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
        }

        .back-btn {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }

        .download-btn:hover, .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .notes-section {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Verifikasi Dokumen</h1>
            <p>Digital Signature Verification System</p>
        </div>

        <div class="content">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Memverifikasi dokumen dan tanda tangan digital...</p>
            </div>

            <div id="result" style="display: none;">
                <!-- Result will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const documentId = urlParams.get('id');
        const signerIndex = urlParams.get('signer');

        async function verifyDocument() {
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');

            if (!documentId) {
                loading.style.display = 'none';
                result.innerHTML = `
                    <div class="error">
                        <h3>❌ ID Dokumen Tidak Valid</h3>
                        <p>Silakan scan QR Code pada dokumen atau gunakan link verifikasi yang benar.</p>
                        <a href="/" class="back-btn">Kembali ke Beranda</a>
                    </div>
                `;
                result.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`/verify-document/${documentId}`);
                const data = await response.json();

                loading.style.display = 'none';
                result.style.display = 'block';

                if (!data.success) {
                    result.innerHTML = `
                        <div class="error">
                            <h3>❌ Dokumen Tidak Ditemukan</h3>
                            <p>${data.message}</p>
                            <a href="/" class="back-btn">Kembali ke Beranda</a>
                        </div>
                    `;
                    return;
                }

                const doc = data.document;
                const signatures = data.signatures || [];
                const allValid = signatures.every(s => s.valid);

                // If signer index specified, show specific signer
                let highlightSigner = signerIndex !== null ? parseInt(signerIndex) : null;

                let signersHtml = '';
                if (signatures.length > 0) {
                    signersHtml = '<div class="signers-section"><h3>✍️ Tanda Tangan Digital</h3>';
                    signatures.forEach((sig, index) => {
                        const isHighlighted = highlightSigner === index;
                        const cardClass = sig.valid ? 'valid' : 'invalid';
                        const highlight = isHighlighted ? 'style="background: #fff3cd;"' : '';

                        signersHtml += `
                            <div class="signer-card ${cardClass}" ${highlight}>
                                ${isHighlighted ? '<div style="color: #856404; font-weight: 600; margin-bottom: 10px;">📍 QR Code ini merujuk pada penandatangan berikut:</div>' : ''}
                                <div class="signer-status ${sig.valid ? 'valid' : 'invalid'}">
                                    ${sig.valid ? '✓ VALID' : '✗ TIDAK VALID'}
                                </div>
                                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                                    <div>
                                        <div class="info-label">Nama</div>
                                        <div class="info-value">${sig.signer_name}</div>
                                    </div>
                                    <div>
                                        <div class="info-label">NIP/NIDN</div>
                                        <div class="info-value">${sig.signer_nip}</div>
                                    </div>
                                    <div>
                                        <div class="info-label">Algoritma</div>
                                        <div class="info-value">${sig.algorithm}</div>
                                    </div>
                                    <div>
                                        <div class="info-label">Waktu</div>
                                        <div class="info-value">${formatDate(sig.signed_at)}</div>
                                    </div>
                                </div>
                                ${sig.public_key ? `
                                    <div style="margin-top: 15px;">
                                        <div class="info-label">Public Key</div>
                                        <div style="font-family: monospace; font-size: 11px; background: #f8f9fa; padding: 10px; border-radius: 5px; word-break: break-all;">
                                            ${sig.public_key.substring(0, 80)}...
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });
                    signersHtml += '</div>';
                }

                result.innerHTML = `
                    <div class="verification-card ${allValid ? '' : 'invalid'}">
                        <div class="status-badge ${allValid ? 'status-valid' : 'status-invalid'}">
                            ${allValid ? '✅ DOKUMEN VALID' : '⚠️ ADA TANDA TANGAN TIDAK VALID'}
                        </div>

                        <h2 style="margin-bottom: 10px; color: #333;">
                            ${doc.document_name || doc.document_title || 'Dokumen'}
                        </h2>
                        <p style="color: #666; margin-bottom: 25px;">
                            ${allValid
                                ? 'Semua tanda tangan digital telah terverifikasi dan valid.'
                                : 'Dokumen ditemukan tetapi ada tanda tangan yang tidak valid.'}
                        </p>

                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">📄 Nama File</div>
                                <div class="info-value">${doc.filename}</div>
                            </div>

                            <div class="info-item">
                                <div class="info-label">📋 Jenis Dokumen</div>
                                <div class="info-value">${doc.document_type ? doc.document_type.toUpperCase() : '-'}</div>
                            </div>

                            <div class="info-item">
                                <div class="info-label">✍️ Jumlah TTD</div>
                                <div class="info-value">${signatures.length} Penandatangan</div>
                            </div>

                            <div class="info-item">
                                <div class="info-label">📅 Tanggal</div>
                                <div class="info-value">${formatDate(doc.timestamp)}</div>
                            </div>

                            <div class="info-item" style="grid-column: 1 / -1;">
                                <div class="info-label">🆔 Document ID</div>
                                <div class="info-value" style="font-size: 12px; word-break: break-all; font-family: monospace;">
                                    ${doc.id}
                                </div>
                            </div>
                        </div>

                        ${doc.notes ? `
                            <div class="notes-section">
                                <h4 style="color: #856404; margin-bottom: 10px;">📝 Catatan</h4>
                                <p style="color: #856404;">${doc.notes}</p>
                            </div>
                        ` : ''}

                        ${signersHtml}

                        <div style="text-align: center; margin-top: 30px;">
                            <a href="/download/${doc.filename}" class="download-btn">
                                📥 Download Dokumen
                            </a>
                            <a href="/" class="back-btn">
                                🏠 Kembali ke Beranda
                            </a>
                        </div>
                    </div>
                `;

            } catch (error) {
                loading.style.display = 'none';
                result.innerHTML = `
                    <div class="error">
                        <h3>❌ Gagal Memverifikasi Dokumen</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <a href="/" class="back-btn">Kembali ke Beranda</a>
                    </div>
                `;
                result.style.display = 'block';
            }
        }

        function formatDate(dateString) {
            if (!dateString) return '-';

            const date = new Date(dateString);
            const options = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                timeZone: 'Asia/Jakarta'
            };

            return date.toLocaleDateString('id-ID', options) + ' WIB';
        }

        // Auto verify on page load
        window.onload = function() {
            verifyDocument();
        };
    </script>
</body>
</html>
